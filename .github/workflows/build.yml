
name: Build ClassicShop

on:
  workflow_dispatch:
  push:
    paths:
      - 'ClassicShop-source-1.21.11.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract source
        run: unzip ClassicShop-source-1.21.11.zip

      - name: Build plugin
        run: mvn -f ClassicShop/pom.xml clean package

      - uses: actions/upload-artifact@v4
        with:
          name: ClassicShop-JAR
          path: ClassicShop/target/*.jar
